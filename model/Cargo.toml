[package]
name = "legal-structure-model"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The document-structure model, text coordinates and analysis seam shared by legal-structure and the parsers that feed it"
repository = "https://github.com/eliziff/legal-structure-parser"
# Publishes where legal-layout's sources are to dependents' build scripts (build.rs).
links = "legal_structure_model"

[features]
# The TypeScript declarations of its types the engine serves (native/legal-structure-node's export-types).
binding-types = ["dep:ts-rs", "legal-layout/binding-types"]

[dependencies]
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
legal-layout = { path = "../layout" }
legal-text = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
