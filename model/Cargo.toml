[package]
name = "legal-structure-model"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The document-structure model, text coordinates and analysis seam shared by legal-structure and the parsers that feed it"
repository = "https://github.com/eliziff/legal-structure-parser"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
