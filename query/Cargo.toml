[package]
name = "legal-document-query"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Queries over a derived legal document: blocks, addresses, passages and text fragments"
repository = "https://github.com/eliziff/legal-structure-parser"

[dependencies]
legal-structure-model = { path = "../model" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-normalization = "0.1"
