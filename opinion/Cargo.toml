[package]
name = "legal-opinion-layer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A court opinion's structure as a lawyer queries it, one flat layer over its stored versions"
repository = "https://github.com/eliziff/legal-structure-parser"

[dependencies]
legal-structure = { path = "..", features = ["structure-inference", "native-markup"] }
legal-structure-model = { path = "../model" }
legal-citations = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
