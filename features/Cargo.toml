[package]
name = "legal-structure-features"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "What the products build on the structure engine: the A2AJ citator graph, quote location and verification, passage links, journal titles, compositions, outlines and reading order"

[features]
default = []
canada = ["legal-structure/canada"]
canlii = ["legal-structure/canlii"]
citator = ["legal-structure/citator", "dep:legal-citations"]
document-query = ["legal-structure/document-query", "dep:legal-document-query"]
provider-text = ["structure-inference", "legal-structure/provider-text"]
structure-inference = ["legal-structure/structure-inference"]
# A document of A2AJ's, read from its API's records or from the local store (src/a2aj.rs).
a2aj-reader = ["provider-text", "citator", "canlii", "dep:url"]
a2aj-store = ["a2aj-reader", "dep:rusqlite"]
# The note-up graph built from the local A2AJ store (src/citator_graph.rs, the citator-graph bin).
citator-graph = ["citator", "provider-text", "document-query", "a2aj-store", "structure-inference"]
quote-verification = ["document-query"]

[dependencies]
legal-structure = { path = ".." }
legal-structure-model = { path = "../model" }
legal-document-query = { path = "../query", optional = true }
legal-citations = { path = "../../common-law-cite/crates/legal-citations", optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
url = { version = "2.5", optional = true }

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "citator-graph"
path = "src/bin/citator_graph.rs"
required-features = ["citator-graph"]
