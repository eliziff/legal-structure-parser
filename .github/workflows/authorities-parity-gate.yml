name: Authorities parity gate
on:
  push:
    branches: [fix/authorities-quotation-parity]
    paths: [.github/workflows/authorities-parity-gate.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed source
        run: |
          git init .
          git remote add origin https://github.com/eliziff/legal-structure-parser.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git fetch --depth=1 origin 03342c4cdb8b1c20166509429654c6ac380c6341
      - name: Apply and test the source candidate
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          from pathlib import Path
          previous = subprocess.check_output(['git','show','03342c4cdb8b1c20166509429654c6ac380c6341:.github/workflows/authorities-parity-gate.yml'],text=True)
          code = previous.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(code), '<prior-gated-candidate>', 'exec'))
          p=Path('src/citator.rs');s=p.read_text()
          s=s.replace('    found.extend(standard_us_matches(value, &STANDARD_CANDIDATE));', '''    // Complete recognized report citations (including a series and page) at
              // their existing start only. The permissive splitter must not turn
              // a pinpoint such as "23 and 25" into a new authority.
              for matched in REPORTER_PATTERN.find_iter(value).flatten() {
                  if let Some(hit) = found.iter_mut().find(|hit| hit.start == matched.start()) {
                      hit.end = hit.end.max(matched.end());
                  }
              }
              found.extend(standard_us_matches(value, &STANDARD_CANDIDATE));''')
          p.write_text(s)
          PY
          rustfmt --edition 2021 src/citator.rs src/quote_verification.rs
          cargo test --locked --features citator,quote-verification --lib > /tmp/test.log 2>&1 || { tail -90 /tmp/test.log; exit 1; }
          tail -5 /tmp/test.log
      - name: Commit gated source and remove temporary workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Authorities parity workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/citator.rs src/quote_verification.rs
          git rm .github/workflows/authorities-parity-gate.yml
          git commit -m 'fix: classify complete reporter authorities and retain full numbered case names'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/authorities-quotation-parity
