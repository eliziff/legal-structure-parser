name: Authorities omission guard
on:
  push:
    branches: [fix/authorities-quotation-parity]
    paths: [.github/workflows/authorities-omission-guard.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed source
        run: |
          git init .
          git remote add origin https://github.com/eliziff/legal-structure-parser.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Keep consecutive ellipses from becoming adjacent wildcards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/quote_verification.rs');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='bcb40df5da620c95d22a115307885c277c4e180278203c9c4b0a03107c6473df'
          old='''    if edits.is_empty() || edits.len() > MAX_MARKED_QUOTE_EDITS {
                  return None;
              }
          '''
          new=old+'''    // A single editorial omission is one gap. Repeated ellipses with no
              // quoted content between them are not additional supported edits.
              if edits.windows(2).any(|pair| {
                  !pair[0].as_str().starts_with('[')
                      && !pair[1].as_str().starts_with('[')
                      && expected[pair[0].end()..pair[1].start()]
                          .trim_matches(javascript_whitespace)
                          .is_empty()
              }) {
                  return None;
              }
          '''
          assert s.count(old)==1;s=s.replace(old,new)
          s+='''
          #[cfg(test)]
          mod repeated_omission_regressions {
              use super::*;
              #[test]
              fn repeated_ellipses_do_not_become_adjacent_wildcards() {
                  let source = "The busybody must decide 12 motions, promptly, before the hearing continues.";
                  for gap in ["… …", "... ...", ". . . . . .", "… … … … …"] {
                      let quote = format!("“The busybody {gap} before the hearing continues.”");
                      assert_eq!(grounded_prose_errors(&quote, &["source".into()],
                          &[VisibleEvidenceText { evidence_id: "source".into(), text: source.into(), labels: vec![] }]).len(), 1);
                  }
              }
          }
          '''
          p.write_text(s)
          PY
          rustfmt --edition 2021 src/quote_verification.rs
      - name: Gate quotation and citation behavior
        run: cargo test --locked --features citator,quote-verification --lib
      - name: Commit only the gated code and remove the temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Authorities parity workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/quote_verification.rs
          git rm .github/workflows/authorities-omission-guard.yml
          git commit -m 'fix: reject repeated omission markers without weakening marked-edit support'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/authorities-quotation-parity
      - name: Build the full Beaver native addon
        run: |
          mkdir /tmp/authorities-build
          cd /tmp/authorities-build
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin bd896cb8a06af9f472feefa3875d65d579235263
          git sparse-checkout set native
          git checkout --detach FETCH_HEAD
          rmdir legal-structure 2>/dev/null || true
          ln -s "$GITHUB_WORKSPACE" legal-structure
          git init legal-pdf-parser
          git -C legal-pdf-parser remote add origin https://github.com/eliziff/legal-pdf-parser.git
          git -C legal-pdf-parser fetch --depth=1 origin ba02df3f77c8301e12a32f0f508e62de74f93cf7
          git -C legal-pdf-parser checkout --detach FETCH_HEAD
          cargo build --locked --release --manifest-path native/legal-structure-node/Cargo.toml
          cp native/legal-structure-node/target/release/liblegal_structure_node.so "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authorities-guard-native
          path: |
            liblegal_structure_node.so
            src/quote_verification.rs
          retention-days: 1
