[package]
name = "legal-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = ["grammar", "python"]
default-members = ["."]
resolver = "2"


[features]
default = []
structure-inference = ["dep:legal-grammar-tables"]
document-query = []
a2aj = ["structure-inference", "document-query"]
journal = ["document-query"]

[dependencies]
aho-corasick = "1.1"
legal-grammar-tables = { path = "grammar", optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 16
incremental = false
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
