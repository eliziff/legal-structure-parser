[package]
name = "legal-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast deterministic legal-document structure detection and queries"
repository = "https://github.com/eliziff/legal-structure-parser"
readme = "README.md"
exclude = ["experiments/**"]

[workspace]
members = ["features", "layout", "model", "python", "query"]
default-members = ["."]
resolver = "2"

[features]
# Every provider adapter is built by default; a jurisdiction's instantiation builds only its own.
default = ["canada", "us", "uk", "journal", "local-pdf"]
canada = ["a2aj", "canlii"]
us = ["courtlistener", "govinfo"]
uk = ["tna", "govuk-et", "hansard"]
a2aj = []
canlii = []
courtlistener = []
govinfo = []
tna = []
govuk-et = []
hansard = []
local-pdf = []
structure-inference = ["dep:legal-citations"]
document-query = ["dep:legal-document-query"]
citator = ["dep:legal-citations"]
native-markup = ["structure-inference"]
provider-text = ["structure-inference"]
journal = []

[dependencies]
legal-structure-model = { path = "model" }
legal-document-query = { path = "query", optional = true }
legal-citations = { path = "../common-law-cite/crates/legal-citations", optional = true }
aho-corasick = "1.1"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 16
incremental = false
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
