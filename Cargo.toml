[package]
name = "legal-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast deterministic legal-document structure detection and queries"
repository = "https://github.com/eliziff/legal-structure-parser"
readme = "README.md"
exclude = ["data/grammar-corpus.json", "data/manifest.json", "grammar/**", "experiments/**"]

[workspace]
members = ["grammar", "python"]
default-members = ["."]
resolver = "2"

[features]
default = []
structure-inference = ["dep:legal-citations"]
document-query = []
citator = ["dep:legal-citations"]
quote-verification = ["document-query"]
native-markup = ["structure-inference"]
provider-text = ["structure-inference"]
footnote-pairing = []
journal = []

[dependencies]
legal-citations = { git = "https://github.com/eliziff/common-law-cite.git", rev = "3f4615f9f6cd0b32ac7164a6bced5352a7f78843", optional = true }
aho-corasick = "1.1"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[build-dependencies]
sha2 = "0.10"

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 16
incremental = false
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
